  # DRAFT — written from the CV; please edit.
  bio = '''
I am a Principal Investigator at the [Biodiversity Research Center, Academia Sinica](https://www.biodiv.tw/) in Taiwan.
I study how populations adapt to their environment, and what that process leaves behind in genomes.

My training spans plant genetics and evolutionary biology. I mapped anaerobic germination QTLs in rice
at National Taiwan University (M.Sc., with Chih-Wei Tung), then used experimental evolution in
*Drosophila simulans* to study polygenic adaptation, sex-specific adaptation and the emergence of
reproductive isolation (Ph.D., Vienna Graduate School of Population Genetics, with Christian Schlötterer).
As a postdoc with Edward Buckler at Cornell University, I worked on comparative genomics across hundreds of
grass species: the genetic basis of environmental adaptation in the Andropogoneae, rhizosphere nitrogen
dynamics, and DNA foundation models for plant genomes.
'''

